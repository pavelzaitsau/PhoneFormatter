name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish again
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: python3 scripts/check-version.py
      - if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check-version.py --tag "$RELEASE_TAG"
      - if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName --jq .tagName
      - run: dotnet test PhoneFormatter.slnx --configuration Release
      - run: dotnet pack src/PhoneFormatter/PhoneFormatter.fsproj --configuration Release --no-restore --output artifacts
      - run: python3 scripts/check-version.py --package artifacts/*.nupkg
      - if: inputs.tag == ''
        uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: master
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - if: steps.release.outputs.release_created == 'true' || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
        run: python3 scripts/check-version.py --tag "$RELEASE_TAG"
      - name: Authenticate to GitHub Packages
        if: steps.release.outputs.release_created == 'true' || inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet nuget add source --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
      - name: Publish package to GitHub Packages
        if: steps.release.outputs.release_created == 'true' || inputs.tag != ''
        run: dotnet nuget push artifacts/*.nupkg --source github --skip-duplicate --no-symbols
      - name: Attach packages to GitHub Release
        if: steps.release.outputs.release_created == 'true' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.nupkg artifacts/*.snupkg --clobber
