name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: python3 scripts/check-version.py
      - run: dotnet test PhoneFormatter.slnx --configuration Release
      - run: dotnet pack src/PhoneFormatter/PhoneFormatter.fsproj --configuration Release --no-restore --output artifacts
      - run: python3 scripts/check-version.py --package artifacts/*.nupkg
