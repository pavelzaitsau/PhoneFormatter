name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test PhoneFormatter.slnx --configuration Release
      - run: dotnet pack src/PhoneFormatter/PhoneFormatter.fsproj --configuration Release --output artifacts
